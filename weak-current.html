<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asamblarea Tablourilor Electrice | PRO_ENGINEERING</title>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(11, 15, 25, 0.60);
            --accent-color: #00f2fe;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(31, 41, 61, 0.8);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(8, 12, 20, 0.82), rgba(8, 12, 20, 0.82)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }
        .logo:hover { color: var(--accent-color); }
        .logo span { color: var(--accent-color); }
        .lang-switch {
            display: flex;
            gap: 5px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .lang-btn.active, .lang-btn:hover {
            background: var(--accent-color);
            color: #000;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        .back-btn {
            display: inline-block;
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-color);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 2rem;
            border: 1px solid var(--accent-color);
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: var(--accent-color);
            color: #000;
        }
        .page-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .page-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            max-width: 800px;
        }
        .services-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .service-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            transition: transform 0.3s, border-color 0.3s;
        }
        .service-item:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }
        .service-item h3 {
            color: var(--accent-color);
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }
        .service-item p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .contact-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            max-width: 500px;
            margin: 3rem auto 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
        }
        .social-btn {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }
        .social-btn:hover {
            border-color: var(--accent-color);
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-color);
        }
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">PRO<span>_ENGINEERING</span></a>
        <div class="lang-switch">
            <button class="lang-btn" onclick="setLang('ro')">RO</button>
            <button class="lang-btn" onclick="setLang('ru')">RU</button>
            <button class="lang-btn" onclick="setLang('en')">EN</button>
        </div>
    </header>

    <div class="container">
        <a href="index.html" class="back-btn" id="back-btn">← Înapoi</a>
        <h1 class="page-title" id="page-title">Asamblarea Tablourilor Electrice</h1>
        <p class="page-desc" id="page-desc">Proiectare, asamblare și modernizare tablouri electrice de orice complexitate.</p>
        
        <div class="services-list" id="services-container"></div>

        <!-- CONTACT SECTION -->
        <div class="contact-box">
            <h2 id="sec-contact" style="font-size: 1.5rem; margin-bottom: 1rem; color: #fff;">Contactează-ne</h2>
            <div class="social-buttons">
                <a href="https://t.me/SmartEnergy_md" target="_blank" rel="noopener noreferrer" class="social-btn">Telegram</a>
                <a href="https://instagram.com/SmartEnergy_md" target="_blank" rel="noopener noreferrer" class="social-btn">Instagram</a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 PRO_ENGINEERING. All rights reserved.
    </footer>

    <script>
        const translations = {
            ro: {
                page_title: "Asamblarea Tablourilor Electrice",
                page_desc: "Proiectare, asamblare și modernizare tablouri electrice de orice complexitate.",
                back_btn: "← Înapoi",
                sec_contact: "Contactează-ne",
                services: [
                    { title: "Tablouri electrice de distribuție (TGD / TD)", desc: "Asamblare tablouri de distribuție pentru apartamente, case și spații comerciale conform schemelor de proiect." },
                    { title: "Tablouri de automatizare și Smart Home", desc: "Integrăm module inteligente, relee programabile, contactoare și sisteme de gestiune de la distanță." },
                    { title: "Sisteme de protecție (Diferențiale, SPD, Relee Tensiune)", desc: "Echipare cu protecții împotriva supratensiunilor, scurtcircuitelor și scurgerilor de curent pentru siguranță maximă." },
                    { title: "Modernizare și reabilitare tablouri vechi", desc: "Diagnosticare, înlocuire echipamente învechite, etichetare profesională și organizare cablaj." }
                ]
            },
            ru: {
                page_title: "Сборка Электрощитов",
                page_desc: "Проектирование, сборка и модернизация электрощитов любой сложности.",
                back_btn: "← Назад",
                sec_contact: "Свяжитесь с нами",
                services: [
                    { title: "Распределительные электрощиты (ГРЩ / ЩR)", desc: "Сборка распределительных щитов для квартир, домов и коммерческих объектов по проектным схемам." },
                    { title: "Щиты автоматики и Умного Дома", desc: "Интеграция умных модулей, программируемых реле, контакторов и систем удаленного управления." },
                    { title: "Системы защиты (УЗО, УЗИП, Реле напряжения)", desc: "Оснащение защитой от скачков напряжения, коротких замыканий и утечек тока для максимальной безопасности." },
                    { title: "Модернизация и реконструкция старых щитов", desc: "Диагностика, замена устаревшего оборудования, профессиональная маркировка и кабель-менеджмент." }
                ],
                en: {
                page_title: "Electrical Panel Assembly",
                page_desc: "Design, assembly and modernization of electrical panels of any complexity.",
                back_btn: "← Back",
                sec_contact: "Contact us",
                services: [
                    { title: "Main Distribution Boards (MDB / DB)", desc: "Assembly of distribution panels for apartments, houses and commercial spaces according to project schemes." },
                    { title: "Automation & Smart Home Panels", desc: "Integrating smart modules, programmable relays, contactors and remote management systems." },
                    { title: "Protection Systems (RCD, SPD, Voltage Relays)", desc: "Equipped with surge protection, short-circuit and current leakage protections for maximum safety." },
                    { title: "Modernization of Old Panels", desc: "Diagnostics, replacement of obsolete equipment, professional labeling and cable organization." }
                ]
            }
        };

        function renderServices(services) {
            const container = document.getElementById('services-container');
            container.innerHTML = '';
            services.forEach(service => {
                const div = document.createElement('div');
                div.className = 'service-item';
                div.innerHTML = `<h3>${service.title}</h3><p>${service.desc}</p>`;
                container.appendChild(div);
            });
        }

        function setLang(lang) {
            localStorage.setItem('preferred_lang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                const onclickAttr = btn.getAttribute('onclick');
                if (onclickAttr && onclickAttr.includes(`'${lang}'`)) {
                    btn.classList.add('active');
                }
            });
            
            const t = translations[lang];
            if (!t) return;

            document.getElementById('page-title').textContent = t.page_title;
            document.getElementById('page-desc').textContent = t.page_desc;
            document.getElementById('back-btn').textContent = t.back_btn;
            document.getElementById('sec-contact').textContent = t.sec_contact;

            renderServices(t.services);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem('preferred_lang') || 'ro';
            setLang(savedLang);
        });
    </script>
</body>
</html>
