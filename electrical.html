<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicii Electrice | PRO_ENERGY</title>

    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(11, 15, 25, 0.60);
            --accent-color: #00f2fe;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(31, 41, 61, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                linear-gradient(
                    rgba(8, 12, 20, 0.82),
                    rgba(8, 12, 20, 0.82)
                ),
                url("bg.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo:hover {
            color: var(--accent-color);
        }

        .logo span {
            color: var(--accent-color);
        }

        .lang-switch {
            display: flex;
            gap: 5px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .lang-btn {
            padding: 5px 10px;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .lang-btn.active,
        .lang-btn:hover {
            color: #000;
            background: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 10px 20px;
            color: var(--accent-color);
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            color: #000;
            background: var(--accent-color);
        }

        .page-title {
            margin-bottom: 1rem;
            font-size: 2.5rem;
            background: linear-gradient(
                135deg,
                #fff 0%,
                var(--accent-color) 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-desc {
            max-width: 800px;
            margin-bottom: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .section-title {
            margin: 2.5rem 0 1.5rem;
            padding-bottom: 0.5rem;
            color: #fff;
            border-bottom: 2px solid var(--accent-color);
            font-size: 1.8rem;
        }

        .services-list {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(300px, 1fr)
            );
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .service-item {
            padding: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            transition:
                transform 0.3s,
                border-color 0.3s;
        }

        .service-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-5px);
        }

        .service-item h3 {
            margin-bottom: 0.8rem;
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        .service-item p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        footer {
            padding: 2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="logo">
            PRO<span>_ENERGY</span>
        </a>

        <div class="lang-switch">
            <button
                type="button"
                class="lang-btn"
                data-lang="ro"
                onclick="setLang('ro')"
            >
                RO
            </button>

            <button
                type="button"
                class="lang-btn"
                data-lang="ru"
                onclick="setLang('ru')"
            >
                RU
            </button>

            <button
                type="button"
                class="lang-btn"
                data-lang="en"
                onclick="setLang('en')"
            >
                EN
            </button>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="back-btn" id="back-btn">
            ← Înapoi
        </a>

        <h1 class="page-title" id="page-title">
            Servicii Electrice
        </h1>

        <p class="page-desc" id="page-desc">
            Soluții complete de electrificare pentru proiecte
            rezidențiale și comerciale.
        </p>

        <h2 class="section-title" id="services-title">
            Servicii la fața locului
        </h2>

        <div class="services-list" id="services-list"></div>
    </main>

    <footer>
        &copy; 2026 PRO_ENERGY. All rights reserved.
    </footer>

    <script>

        backButton: "← Înapoi",

                desc:
                    "Diagnosticarea rapidă a defecțiunilor, eliminarea scurtcircuitelor, întreruperilor de alimentare, contactelor slăbite și altor probleme care afectează funcționarea instalației electrice."

    ru: {

        pageDesc:
            "Выполняем монтаж, модернизацию, диагностику и обслуживание электрических систем для жилых, коммерческих и технических объектов с соблюдением требований безопасности и действующих технических норм.",

        services: [

            {
                title: "Сборка и модернизация электрических щитов",

            }
        ]
    },

    en: {
        pageTitle: "Professional Electrical Services",
        pageDesc:
            "We provide installation, modernization, diagnostics and maintenance of electrical systems for residential, commercial and technical facilities in accordance with safety requirements and current technical standards.",
        backButton: "← Back",
        servicesTitle: "On-Site Electrical Works",
        services: [
            {
                title: "Electrical System Design and Planning",
                desc:
                    "Development of technical solutions for internal electrical networks, including load distribution, lighting circuits, socket groups, protection devices and distribution boards based on the facility purpose and actual power demand."
            },
            {
                title: "Electrical Network Diagnostics and Audit",
                desc:
                    "Inspection of wiring, connections, protective devices and distribution lines. Detection of overloads, weak contacts, installation errors, overheating risks and sections requiring replacement or modernization."
            },
            {

                desc:
                    "Installation of power and low-voltage cable routes with cable cross-section selected according to calculated load, operating conditions and safety requirements."
            },
            {

                desc:

            },
            {

                desc:
                    "Design and installation of functional, decorative, facade, outdoor and technical lighting systems. Selection of control schemes, fixture types and energy-efficient solutions for each project."

            {

                desc:
                    "Safe connection of household appliances, power equipment, heating devices, pumps, ventilation systems and other electrical consumers with verification of supply parameters and protection devices."
            },
            {
                title: "Distribution Board Assembly and Modernization",
                desc:
                    "Assembly and configuration of distribution boards with circuit breakers, RCDs, RCBOs, voltage relays, busbars, terminal blocks and protection elements according to the calculated scheme."
            },
            {
                title: "Fault Finding and Emergency Electrical Works",
                desc:
                    "Fast identification of power outages, short circuits, voltage drops, contact overheating and equipment failures. Troubleshooting and restoration of safe electrical system operation."
            }
        ]
    }
};

      function renderServices(services) {
            const container =
                document.getElementById("services-list");

            container.replaceChildren();

            services.forEach((service) => {
                const card = document.createElement("article");
                card.className = "service-item";

                const title = document.createElement("h3");
                title.textContent = service.title;

                const description = document.createElement("p");
                description.textContent = service.desc;

                card.append(title, description);
                container.appendChild(card);
            });
        }

        function setLang(lang) {
            const translation =
                translations[lang] || translations.ro;

            localStorage.setItem("preferred_lang", lang);
            document.documentElement.lang = lang;

            document.querySelectorAll(".lang-btn").forEach((button) => {
                button.classList.toggle(
                    "active",
                    button.dataset.lang === lang
                );
            });

            document.getElementById("page-title").textContent =
                translation.pageTitle;

            document.getElementById("page-desc").textContent =
                translation.pageDesc;

            document.getElementById("back-btn").textContent =
                translation.backButton;

            document.getElementById("services-title").textContent =
                translation.servicesTitle;

            renderServices(translation.services);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang =
                localStorage.getItem("preferred_lang") || "ro";

            setLang(savedLang);
        });
    </script>
</body>
</html>
