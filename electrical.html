<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicii Electrice | PRO_ENGINEERING</title>

    <style>
        /* Стили остаются без изменений */
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="logo">
            PRO<span>_ENERGY</span>
        </a>

        <div class="lang-switch">
            <button type="button" class="lang-btn" data-lang="ro" onclick="setLang('ro')">RO</button>
            <button type="button" class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
            <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="back-btn" id="back-btn">← Înapoi</a>

        <h1 class="page-title" id="page-title">Servicii Electrice</h1>
        <p class="page-desc" id="page-desc">Soluții electrice complete pentru proiecte rezidențiale și comerciale.</p>

        <h2 class="section-title" id="services-title">Servicii la fața locului</h2>
        <div class="services-list" id="services-list"></div>
    </main>

    <footer>
        &copy; 2026 PRO_ENGINEERING. All rights reserved.
    </footer>

    <script>
        const translations = {
            ro: {
                pageTitle: "Servicii Electrice",
                pageDesc: "Soluții electrice complete pentru proiecte rezidențiale și comerciale.",
                backButton: "← Înapoi",
                servicesTitle: "Servicii la fața locului",
                services: [
                    { title: "Proiectare instalații electrice", desc: "Proiectare conform normelor de siguranță." },
                    { title: "Audit instalații electrice", desc: "Evaluare și recomandări pentru îmbunătățire." },
                    { title: "Montaj cabluri", desc: "Montaj profesional de cabluri de calitate." },
                    { title: "Instalare prize și întrerupătoare", desc: "Montaj în locațiile stabilite." },
                    { title: "Instalații de iluminat", desc: "Proiectare și instalare eficiente." },
                    { title: "Conectare electrocasnice", desc: "Conectare sigură a aparatelor." },
                    { title: "Asamblare panouri de distribuție", desc: "Asamblare și cablare corectă." },
                    { title: "Intervenții de urgență", desc: "Reparații rapide 24/7." }
                ]
            },
            ru: {
                pageTitle: "Электромонтажные услуги",
                pageDesc: "Полный спектр электромонтажных решений для жилых и коммерческих объектов.",
                backButton: "← Назад",
                servicesTitle: "Услуги на объекте",
                services: [
                    { title: "Проектирование электроустановок", desc: "Проектирование по нормам безопасности." },
                    { title: "Аудит электроустановок", desc: "Оценка и рекомендации по улучшению." },
                    { title: "Монтаж кабелей", desc: "Профессиональный монтаж качественных кабелей." },
                    { title: "Установка розеток и выключателей", desc: "Монтаж в предусмотренных местах." },
                    { title: "Монтаж освещения", desc: "Эффективное проектирование и установка." },
                    { title: "Подключение бытовой техники", desc: "Безопасное подключение приборов." },
                    { title: "Сборка распределительных щитов", desc: "Правильная сборка и подключение." },
                    { title: "Аварийные работы", desc: "Быстрые ремонты 24/7." }
                ]
            },
            en: {
                pageTitle: "Electrical Services",
                pageDesc: "Complete electrical solutions for residential and commercial projects.",
                backButton: "← Back",
                servicesTitle: "On-Site Services",
                services: [
                    { title: "Electrical Installation Design", desc: "Design compliant with safety standards." },
                    { title: "Electrical Installation Audit", desc: "Evaluation and improvement recommendations." },
                    { title: "Cable Installation", desc: "Professional installation of quality cables." },
                    { title: "Socket and Switch Installation", desc: "Installation in designated locations." },
                    { title: "Lighting Installation", desc: "Efficient design and installation." },
                    { title: "Appliance Connection", desc: "Safe connection of appliances." },
                    { title: "Distribution Panel Assembly", desc: "Correct assembly and wiring." },
                    { title: "Emergency Repairs", desc: "Fast repairs available 24/7." }
                ]
            }
        };

        function renderServices(services) {
            const container = document.getElementById("services-list");
            container.replaceChildren();

            services.forEach((service) => {
                const card = document.createElement("article");
                card.className = "service-item";

                const title = document.createElement("h3");
                title.textContent = service.title;

                const description = document.createElement("p");
                description.textContent = service.desc;

                card.append(title, description);
                container.appendChild(card);
            });
        }

        function setLang(lang) {
            const translation = translations[lang] || translations.ro;

            localStorage.setItem("preferred_lang", lang);
            document.documentElement.lang = lang;

            document.querySelectorAll(".lang-btn").forEach((button) => {
                button.classList.toggle("active", button.dataset.lang === lang);
            });

            document.getElementById("page-title").textContent = translation.pageTitle;
            document.getElementById("page-desc").textContent = translation.pageDesc;
            document.getElementById("back-btn").textContent = translation.backButton;
            document.getElementById("services-title").textContent = translation.servicesTitle;

            renderServices(translation.services);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem("preferred_lang") || "ro";
            setLang(savedLang);
        });
    </script>
</body>
</html>
