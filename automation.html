<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatizări Industriale | PRO_ENERGY</title>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(11, 15, 25, 0.60);
            --accent-color: #00f2fe;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(31, 41, 61, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(8, 12, 20, 0.82), rgba(8, 12, 20, 0.82)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        .logo:hover {
            color: var(--accent-color);
        }

        .logo span {
            color: var(--accent-color);
        }

        .lang-switch {
            display: flex;
            gap: 5px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .lang-btn.active,
        .lang-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .back-btn {
            display: inline-block;
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-color);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 2rem;
            border: 1px solid var(--accent-color);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        .page-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            max-width: 800px;
        }

        .section-title {
            font-size: 1.8rem;
            margin: 2.5rem 0 1.5rem;
            color: #fff;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
        }

        .services-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .service-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            transition: transform 0.3s, border-color 0.3s;
        }

        .service-item:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .service-item h3 {
            color: var(--accent-color);
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }

        .service-item p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="logo">PRO<span>_ENERGY</span></a>

        <div class="lang-switch">
            <button class="lang-btn" onclick="setLang('ro')">RO</button>
            <button class="lang-btn" onclick="setLang('ru')">RU</button>
            <button class="lang-btn" onclick="setLang('en')">EN</button>
        </div>
    </header>

    <div class="container">
        <a href="index.html" class="back-btn" id="back-btn">← Înapoi</a>

        <h1 class="page-title" id="page-title">Automatizări Industriale</h1>

        <p class="page-desc" id="page-desc">

        </p>

        <h2 class="section-title" id="sec-onsite">Servicii de automatizare industrială</h2>

    </div>

    <footer>
        &copy; 2026 PRO_ENERGY. All rights reserved.
    </footer>

                    },
                    {

                    },

            en: {
                page_title: "Professional Industrial Automation",
                page_desc:
                    "We design, install and commission automation systems for industrial equipment, production lines and technological processes, focusing on reliability, safety and efficient process control.",
                back_btn: "← Back",
                sec_onsite: "Industrial Automation Services",
                onsite: [
                    {
                        title: "Industrial Automation System Design",
                        desc:
                            "Development of technical solutions for automated production processes, including control system structure, equipment operating logic, protection circuits, switching schemes and integration of actuators."
                    },

                        title: "Automation and Control Panel Assembly",
                        desc:
                            "Assembly of control cabinets and automation panels for equipment and technological lines with PLCs, contactors, relays, power supplies, terminal blocks, protection devices and indication elements."
                    },

                    {

        function renderServices(containerId, services) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            services.forEach(service => {
                const div = document.createElement("div");
                div.className = "service-item";
                div.innerHTML = `<h3>${service.title}</h3><p>${service.desc}</p>`;
                container.appendChild(div);
            });
        }

        function setLang(lang) {
            localStorage.setItem("preferred_lang", lang);

            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.classList.remove("active");

                const onclickAttr = btn.getAttribute("onclick");

                if (onclickAttr && onclickAttr.includes(`'${lang}'`)) {
                    btn.classList.add("active");
                }
            });

            const t = translations[lang];

            if (!t) return;

            document.documentElement.lang = lang;

            document.getElementById("page-title").textContent = t.page_title;
            document.getElementById("page-desc").textContent = t.page_desc;
            document.getElementById("back-btn").textContent = t.back_btn;
            document.getElementById("sec-onsite").textContent = t.sec_onsite;

            renderServices("onsite-services", t.onsite);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem("preferred_lang") || "ro";
            setLang(savedLang);
        });
    </script>
</body>
</html>
